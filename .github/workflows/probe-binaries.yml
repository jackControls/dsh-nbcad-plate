# Builds the print-probe binary for every platform the plugin packs under bin/<platform>/.
# Download the artifacts of a run with `gh run download <run-id> -D dist`, copy them into bin/, then run
# `node tools/probe-sums.mjs` (the manifest the host checks) and `gh attestation verify bin/<platform>/print-probe
# --repo jackControls/dsh-noBS-CAD-step` (every build here is attested).
name: probe binaries

on:
  workflow_dispatch:
  push:
    paths:
      - 'native/print-probe/**'
      - '.github/workflows/probe-binaries.yml'

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin, platform: darwin-arm64, exe: '' }
          - { os: macos-latest, target: x86_64-apple-darwin, platform: darwin-x64, exe: '' }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, platform: linux-x64, exe: '' }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, platform: linux-arm64, exe: '' }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, platform: win32-x64, exe: '.exe' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        shell: bash
        run: |
          rustup update stable
          rustup default stable
          rustup target add ${{ matrix.target }}
      - name: Build
        shell: bash
        run: cargo build --release --locked --target ${{ matrix.target }} --manifest-path native/print-probe/Cargo.toml
      - name: Collect
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.platform }}
          cp native/print-probe/target/${{ matrix.target }}/release/print-probe${{ matrix.exe }} dist/${{ matrix.platform }}/
          ls -la dist/${{ matrix.platform }}
      - name: Checksum
        shell: bash
        run: node -e "const c=require('node:crypto'),f=require('node:fs');const p=process.argv[1];console.log(c.createHash('sha256').update(f.readFileSync(p)).digest('hex')+'  '+p)" dist/${{ matrix.platform }}/print-probe${{ matrix.exe }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/${{ matrix.platform }}/print-probe${{ matrix.exe }}
      - uses: actions/upload-artifact@v4
        with:
          name: print-probe-${{ matrix.platform }}
          path: dist/${{ matrix.platform }}/print-probe${{ matrix.exe }}
          if-no-files-found: error
