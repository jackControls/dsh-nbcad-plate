[package]
name = "print-probe"
version = "0.1.0"
edition = "2021"
description = "Fast pixel tools for scanned plate prints: outline calibration, millimetre crops with overlays, ring scores at given centres, hole-symbol detection and coverage matching."
license = "MIT"

[dependencies]
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
