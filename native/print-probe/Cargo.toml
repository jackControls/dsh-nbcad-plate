[package]
name = "print-probe"
version = "0.2.0"
edition = "2021"
description = "Fast pixel tools for plate prints (PDF, PNG or JPG, rendered by the binary itself): outline calibration, millimetre crops with overlays, ring scores at given centres, hole-symbol detection and coverage matching."
license = "MIT"

[dependencies]
hayro = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
png = "0.17"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
